# SPDX-License-Identifier: MPL-2.0

[workspace]
members = ["version-ranges"]

[package]
name = "pubgrub"
version = "0.4.0"
authors = [
    "Matthieu Pizenberg <matthieu.pizenberg@gmail.com>",
    "Alex Tokarev <aleksator@gmail.com>",
    "Jacob Finkelman <Eh2406@wayne.edu>",
]
edition = "2024"
description = "PubGrub version solving algorithm"
readme = "README.md"
repository = "https://github.com/pubgrub-rs/pubgrub"
license = "MPL-2.0"
keywords = ["dependency", "pubgrub", "semver", "solver", "version"]
categories = ["algorithms"]
include = ["Cargo.toml", "LICENSE", "README.md", "src/**", "tests/**", "examples/**", "benches/**"]
# NOTE: Keep in sync with `ci.yml`
rust-version = "1.92"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
indexmap = "2.7.0"
# for debug logs in tests
log = "0.4.27"
priority-queue = "2.3.1"
rustc-hash = "^2.1.1"
serde = { version = "1.0", features = ["derive"], optional = true }
thiserror = "2.0"
version-ranges = { version = "0.1.0", path = "version-ranges" }

[dev-dependencies]
criterion = { version = "4.7.0", package = "codspeed-criterion-compat" }
env_logger = "0.11.6"
# Lower-bound guard for `codspeed-criterion-compat` in the minimal-versions CI job.
cc = "1.2.40"
# Lower-bound guards to keep the transitive `rustix` buildable in the
# minimal-versions CI job. rustix below 0.38.6 uses the
# `rustc_layout_scalar_valid_range_start` attribute removed from the compiler in
# rust-lang/rust#155433, so it no longer builds on nightly (see
# bytecodealliance/rustix#1620). `codspeed-criterion-compat -> is-terminal` pulls
# rustix 0.37 until is-terminal 0.4.8, and `proptest -> tempfile` resolves rustix
# 0.38.0 until tempfile 3.9 raises its floor to rustix 0.38.26.
is-terminal = "0.4.8"
tempfile = "3.9"
proptest = "1.6.0"
ron = "0.12.0"
varisat = "0.2.2"
version-ranges = { version = "0.1.0", path = "version-ranges", features = ["proptest"] }

[features]
serde = ["dep:serde", "version-ranges/serde"]

[[bench]]
name = "backtracking"
harness = false

[[bench]]
name = "large_case"
harness = false
required-features = ["serde"]

[[bench]]
name = "sudoku"
harness = false
